name: Android CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug
        run: ./gradlew assembleDebug
